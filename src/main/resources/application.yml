server:
  port: 8111
spring:
  application:
    name: fuckoff
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      password: 123456
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bbbdb?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: '123456'
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

# Swagger / OpenAPI 3 (springdoc) 配置
# 访问 http://localhost:8111/swagger-ui.html 进行在线接口测试
# 访问 http://localhost:8111/v3/api-docs 获取 JSON 文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha       # 标签按字母排序
    operations-sorter: alpha # 接口按字母排序
    display-request-duration: true
  packages-to-scan: com.example.demo.controller

logging:
  level:
    com.example.demo: debug
  pattern:
    dateformat: mm:ss.SSS


